<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FIXORE · Civic Pulse</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0b1730;--mut:#55657f;--navy:#0a1630;--b:#2b6bff;--t:#0fb8a5;--line:#e0e7f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#060d20;--card:#0e1b3a;--ink:#e8eefc;--mut:#9db0d3;--line:#1e3059;color-scheme:dark}}
:root[data-theme=dark]{--bg:#060d20;--card:#0e1b3a;--ink:#e8eefc;--mut:#9db0d3;--line:#1e3059;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 18px}
.logo{font-weight:800;letter-spacing:.5px;font-size:19px;color:#fff;text-decoration:none}.logo b{color:var(--t)}
nav{display:flex;flex-wrap:wrap;gap:2px;flex:1}nav a{color:#c8d6f5;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px}nav a.on,nav a:hover{background:#17285a;color:#fff}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
header select{background:#17285a;color:#fff;border-color:#2a3f7a}
main{max-width:1120px;margin:0 auto;padding:22px 16px 50px}
.hero{background:linear-gradient(135deg,#0a1630,#123a8f 60%,#0fb8a5);color:#fff;border-radius:24px;padding:48px 28px;animation:in .6s}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0 0 12px;max-width:680px}.hero p{max-width:600px;color:#d6e2ff}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--b);color:#fff;text-decoration:none;font-size:15px;margin:4px 6px 4px 0}
.btn.t{background:var(--t);color:#04211d}.btn.g{background:transparent;color:inherit;border:1px solid var(--line)}.btn.s{padding:5px 11px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(10,22,48,.06)}
.card h3{margin:0 0 8px}.big{font-size:32px;font-weight:800}.mut{color:var(--mut);font-size:13px}h2{margin:30px 0 12px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;color:#fff;margin-right:4px}.chip.o{background:var(--line);color:var(--ink)}
.bar{height:10px;border-radius:6px;background:var(--b);min-width:3px}.row{display:flex;align-items:center;gap:8px;margin:5px 0}.row .l{width:150px;font-size:13px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
label{display:block;font-weight:600;margin:10px 0 3px}input,textarea,select{width:100%}
.tl{list-style:none;padding:0;margin:0}.tl li{padding:2px 0 12px 26px;position:relative;border-left:2px solid var(--line);margin-left:8px}.tl li:before{content:"";position:absolute;left:-8px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--line)}.tl li.d:before{background:var(--t);border-color:var(--t)}
#m{position:fixed;inset:0;background:rgba(3,8,20,.65);z-index:20;display:none;overflow:auto;padding:20px 10px}#m>div{max-width:760px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;display:none}
svg.map{width:100%;height:auto;background:#0d1e45;border-radius:16px;touch-action:manipulation}
.sc{overflow-x:auto}.warn{border-left:4px solid #d9a400}footer{margin-top:40px;color:var(--mut);font-size:13px}
</style></head><body>
<header><a class="logo" href="#home">FIX<b>ORE</b> <span style="font-weight:400;font-size:12px;opacity:.7">Civic Pulse</span></a><nav id="nav"></nav>
<select id="role" aria-label="Demo sign-in role" onchange="setRole(this.value)"></select></header>
<main id="app"></main><div id="m" onclick="if(event.target===this)this.style.display='none'"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const CATS=['Roads','Waterlogging','Garbage','Streetlights','Drainage','Water Supply','Public Infrastructure','Other'];
const DEPT={Roads:'Public Works',Waterlogging:'Drainage & Flood Control',Garbage:'Sanitation',Streetlights:'Electrical',Drainage:'Drainage & Flood Control','Water Supply':'Water Board','Public Infrastructure':'Public Works',Other:'General Services'};
const OFF={'Public Works':['R. Iyer','S. Menon'],'Drainage & Flood Control':['A. Kulkarni','D. Nair'],Sanitation:['P. Das','M. Khan'],Electrical:['T. Verma','L. Joseph'],'Water Board':['K. Reddy','N. Bose'],'General Services':['V. Shah','J. Roy']};
const ALLOFF=Object.entries(OFF).flatMap(([d,a])=>a.map(n=>[n,d]));
const KW={Roads:['pothole','crater','asphalt','tarmac','crack','broken road','damaged road'],Waterlogging:['waterlog','water log','flood','stagnant','submerg','knee deep','puddle'],Garbage:['garbage','trash','waste','bin','litter','rubbish','dump'],Streetlights:['streetlight','street light','lamp','bulb','dark'],Drainage:['drain','sewer','manhole','gutter','clog'],'Water Supply':['tap','supply','pipeline','pipe','leak','no water'],'Public Infrastructure':['bridge','footpath','pavement','railing','wall','bench','building','playground']};
const SAFE=['accident','injur','fell','fall','child','school','hospital','live wire','electric','shock','open manhole','deep','danger','hazard','collapse','fire','elderly'];
const URG=['urgent','immediately','emergency','days','week','since','again','overflow','severe','worst'];
const BUSY=['main','highway','junction','market','bus','station','busy','crowd','school','hospital'];
const BASE={Waterlogging:8,Roads:6,'Water Supply':6,Drainage:6,Streetlights:5,Garbage:4,'Public Infrastructure':6,Other:2};
const REC={Roads:'Inspect and patch the damaged surface; place warning markers until repaired.',Waterlogging:'Dispatch a pump crew, clear inlets, and check upstream drains; warn motorists on the route.',Garbage:'Schedule an urgent bin clearance and review the pickup frequency for this spot.',Streetlights:'Send an electrical crew to check the circuit and replace failed lamps; prioritise if on a busy road.',Drainage:'Desilt and flush the blocked drain; inspect for repeat blockage.',"Water Supply":'Inspect the pipeline for leaks or pressure loss; notify affected households.',"Public Infrastructure":'Carry out a safety inspection and cordon off the area if structurally unsafe.',Other:'Route to General Services for triage and manual review.'};
const ZN=['North Ward','Market Ward','East Ward','West Ward','Central Ward','Riverside','South Ward','Station Ward','Harbour Ward'];
const zone=(x,y)=>ZN[Math.min(2,Math.floor(y/34))*3+Math.min(2,Math.floor(x/34))];
const PC={Critical:'#e5484d',High:'#f5821f',Medium:'#c99a00',Low:'#2fb36d'},W={Critical:4,High:3,Medium:2,Low:1};
const ST=['Submitted','AI Analyzed','Under Review','Assigned','In Progress','Resolved'];
const STOP=new Set('the and was are for has have with that this from near there been very not but you our they its out into over'.split(' '));
const fmt=t=>new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const tok=t=>new Set(t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.replace(/(ing|es|s)$/,'')));
const hits=(t,l)=>l.filter(k=>t.includes(k)).length;
function analyze(c,all){try{
 const tx=(c.title+' . '+c.desc).toLowerCase();let best='Other',bh=0;
 for(const k of CATS){const h=KW[k]?hits(tx,KW[k]):0;if(h>bh){bh=h;best=k}}
 const conf=bh?Math.min(.95,.45+.15*bh):.2,A=tok(tx);
 const dups=all.filter(o=>o.id!==c.id&&!o.merged).map(o=>{const B=tok(o.title+' '+o.desc);let i=0;A.forEach(w=>B.has(w)&&i++);const sim=i/(A.size+B.size-i||1),d=Math.hypot(o.x-c.x,o.y-c.y);return{id:o.id,sim:Math.round(sim*100),d:+d.toFixed(1),ok:d<9&&((o.cat===(c.cat||best)&&sim>=.2)||sim>=.4)}}).filter(o=>o.ok).sort((a,b)=>b.sim-a.sim).slice(0,5);
 const near=all.filter(o=>o.id!==c.id&&!o.merged&&Math.hypot(o.x-c.x,o.y-c.y)<10).length,cat=c.cat||best;
 const sh=hits(tx,SAFE),uh=hits(tx,URG),bz=hits(tx,BUSY);
 const f={Safety:Math.min(40,sh*14),Urgency:Math.min(20,uh*7),Impact:Math.min(20,bz*8+BASE[cat]),'Similar reports':Math.min(15,dups.length*5),'Geographic concentration':Math.min(10,near*2)};
 const score=Object.values(f).reduce((a,b)=>a+b,0),level=score>=65?'Critical':score>=45?'High':score>=25?'Medium':'Low';
 const why=[];if(f.Safety)why.push(`${sh} safety-risk term(s) found in the text`);if(f.Urgency)why.push(`${uh} urgency term(s) (e.g. severity or duration)`);if(bz)why.push(`mentions busy or high-footfall places (${bz} term(s))`);if(dups.length)why.push(`${dups.length} likely duplicate report(s) nearby`);if(near)why.push(`${near} other report(s) within the same area`);if(!why.length)why.push('no strong risk, urgency or clustering signals found');
 const sum=(c.desc.split(/[.!?\n]/)[0]||c.desc).trim().slice(0,110);
 const ai={mode:'rule-based',cat:best,conf:Math.round(conf*100),f,score,level,dups,why,
  summary:`${cat}: ${sum}${sum.length>=110?'…':''}`,dept:DEPT[cat],rec:REC[cat]};
 ai.brief=[['What happened',ai.summary],['Where',`${zone(c.x,c.y)} (map ${Math.round(c.x)}, ${Math.round(c.y)})`],['How serious',`${level} (score ${score}/100, AI-assessed, needs human review)`],['Similar complaints',dups.length+' likely duplicate(s); '+near+' other report(s) close by'],['Action to consider',`${ai.rec} Suggested department: ${ai.dept}.`],['Why prioritise',why[0]]];
 return ai}catch(e){return{mode:'failed',fail:true,level:'Medium',score:null,cat:c.cat||'Other',dups:[],why:['AI analysis failed; default Medium assigned. A human must review.'],summary:c.title,f:{},brief:[],dept:DEPT[c.cat]||'General Services',rec:''}}}
function seed(){let sd=11;const r=()=>(sd=sd*16807%2147483647)/2147483647,now=Date.now();
 const T={Waterlogging:['Severe waterlogging near the main market junction, knee deep water, school children struggle to cross','Water logged on main road since morning, vehicles stuck, dangerous for school children','Flooded street at market junction after rain, water knee deep, two wheelers falling','Heavy waterlogging outside the bus stop, drain blocked, water entering shops'],Roads:['Large pothole on the main road causing accidents, bikes skidding','Deep potholes near the signal, road badly damaged and dangerous','Crater like pothole on the main road, vehicles swerving, urgent repair needed'],Garbage:['Garbage bin overflowing near the vegetable market, bad smell for days','Trash piled up beside the market gate, not collected for a week','Waste dumped near market wall, rubbish spreading to the road'],Streetlights:['Streetlight not working on the lane, very dark at night','Three street lights are broken, dark road, women feel unsafe','Lamp post bulb fused for weeks, area is dark'],Drainage:['Drain clogged and overflowing near the crossing, sewage smell','Blocked drain causing stagnant water behind the shops'],'Water Supply':['No water supply in our lane since two days','Pipeline leak on the street wasting water, low pressure'],'Public Infrastructure':['Footpath railing broken near the park, children could fall','Bench and wall damaged at the bus shelter'],Other:['Stray animals gathering near the school gate','Noise from construction late at night']};
 const NM='Aarav,Meera,Kabir,Isha,Rohan,Anaya,Vikram,Sara,Dev,Nisha'.split(',');
 const spec=[['Waterlogging',30,30,7],['Roads',70,70,6],['Garbage',50,10,5],['Streetlights',10,90,5],['Drainage',30,30,2]];let L=[];
 spec.forEach(([cat,cx,cy,n])=>{for(let i=0;i<n;i++)L.push({cat,x:cx+(r()-.5)*11,y:cy+(r()-.5)*11,desc:T[cat][i%T[cat].length]})});
 for(let i=0;i<17;i++){const cat=CATS[i%8];L.push({cat,x:r()*100,y:r()*100,desc:T[cat][Math.floor(r()*T[cat].length)]})}
 L.forEach(o=>{o.created=now-Math.floor(r()*14*864e5)-36e5;o.title=o.desc.split(',')[0].slice(0,60)});L.sort((a,b)=>a.created-b.created);
 const C=[];L.forEach((o,i)=>{const c={...o,id:'FX-'+(1001+i),name:NM[i%10]+' (synthetic)',contact:'synthetic'+i+'@example.com',synthetic:true,history:[],status:'Submitted'};
  c.ai=analyze(c,C);C.push(c);const age=(now-c.created)/36e5,p=r();let k=p<.15?1:p<.3?2:p<.5?3:p<.7?4:5;k=Math.min(k,age>72?5:age>24?4:2);
  const h=[0,.03,4,9,20,45],ps=[[ 'Submitted','Complaint received'],['AI Analyzed','Rule-based analysis: '+c.ai.level+' ('+c.ai.score+'/100)'],['Under Review','Reviewed by an administrator'],['Assigned','Assigned to '+DEPT[c.cat]],['In Progress','Work started on site'],['Resolved','Issue fixed and verified']];
  for(let j=0;j<=k;j++)c.history.push({t:c.created+h[j]*36e5,s:ps[j][0],note:ps[j][1]});c.status=ST[k];
  if(k>=3){c.dept=DEPT[c.cat];c.officer=OFF[c.dept][i%2]}
  if(k==5)c.ev={note:'Synthetic resolution evidence',before:'before_synthetic.jpg',after:'after_synthetic.jpg'}});
 return{c:C,n:[],mine:[],seq:1001+C.length}}
const K='fixore_civicpulse_v2';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.c)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let R={r:'citizen',n:''},M={z:1,cx:50,cy:50,cat:'',pr:'',st:'',q:'',cl:true},P={x:50,y:50},IMG='',DONE='',TQ='',AF={q:'',st:''};
const act=()=>S.c.filter(c=>!c.merged),lv=c=>c.ov||c.ai.level,get=id=>S.c.find(c=>c.id===id);
const chip=l=>`<span class="chip" style="background:${PC[l]}">${l}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function push(c,s,note){c.history.push({t:Date.now(),s,note});c.status=s}
function notif(to,cid,msg){S.n.unshift({to,cid,msg,t:Date.now()})}
function hot(){const g={};act().forEach(c=>{const k=c.cat+'|'+Math.floor(c.x/20)+'|'+Math.floor(c.y/20);(g[k]=g[k]||[]).push(c)});
 return Object.values(g).filter(a=>a.length>=3).map(a=>{const x=a.reduce((s,c)=>s+c.x,0)/a.length,y=a.reduce((s,c)=>s+c.y,0)/a.length,avg=a.reduce((s,c)=>s+W[lv(c)],0)/a.length;return{cat:a[0].cat,n:a.length,x,y,avg,zone:zone(x,y),ids:a.map(c=>c.id),rank:a.length*avg,act:REC[a[0].cat]}}).sort((a,b)=>b.rank-a.rank)}
function cis(){const o={};ZN.forEach(z=>o[z]={z,raw:0,n:0});act().filter(c=>c.status!=='Resolved').forEach(c=>{const z=o[zone(c.x,c.y)];z.raw+=W[lv(c)];z.n++});hot().forEach(h=>o[h.zone].raw+=2);return Object.values(o).map(z=>({...z,s:Math.min(100,Math.round(z.raw*2.5))})).sort((a,b)=>b.s-a.s)}
const nav=()=>{const h=location.hash.slice(1)||'home';$('#nav').innerHTML=[['home','Home'],['report','Report Issue'],['track','Track Complaint'],['dash','Live Dashboard'],['map','Map & Hotspots'],['staff','Staff Panel'],['about','About']].map(([k,l])=>`<a href="#${k}" class="${h===k?'on':''}">${l}</a>`).join('');
 $('#role').innerHTML='<option value="citizen">Citizen (demo login)</option><option value="admin">Admin (demo login)</option>'+ALLOFF.map(([n,d])=>`<option value="o:${n}">Officer ${n} · ${d}</option>`).join('');$('#role').value=R.r==='officer'?'o:'+R.n:R.r};
function setRole(v){R=v.startsWith('o:')?{r:'officer',n:v.slice(2)}:{r:v,n:''};toast('Signed in as '+(R.r==='officer'?'Officer '+R.n:R.r)+' (mocked demo login, no real authentication)');render()}
const stats=()=>{const a=S.c,res=a.filter(c=>c.status==='Resolved'),hr=res.map(c=>c.history.at(-1).t-c.created);return{tot:a.length,pen:a.filter(c=>ST.indexOf(c.status)<4).length,prog:a.filter(c=>c.status==='In Progress').length,res:res.length,crit:a.filter(c=>c.status!=='Resolved'&&!c.merged&&lv(c)==='Critical').length,pct:a.length?Math.round(res.length/a.length*100):0,avg:hr.length?Math.round(hr.reduce((x,y)=>x+y,0)/hr.length/36e5):0}};
const V={};const hooks={};
V.home=()=>{const s=stats(),h=hot();return`<section class="hero"><div class="mut" style="color:#9ff0e5">Your Voice. Our Intelligence. Better Communities.</div><h1>Turning Every Civic Complaint Into Meaningful Action.</h1><p>FIXORE Civic Pulse turns scattered citizen reports into prioritised, explainable and trackable action: it categorises, summarises, de-duplicates, scores and maps every report.</p><a class="btn t" href="#report">Report a Problem</a><a class="btn g" style="color:#fff;border-color:#fff6" href="#dash">Explore Live Dashboard</a></section>
<div class="grid" style="margin-top:16px">${[['Total complaints',s.tot,''],['Issues resolved',s.res,''],['Open critical',s.crit,''],['Avg resolution (hrs)',s.avg,'']].map(([l,n])=>`<div class="card"><div class="big cnt" data-n="${n}">0</div><div class="mut">${l}</div></div>`).join('')}</div>
<p class="mut">Figures are computed live from the records in this browser. The seeded records are <b>synthetic demo data</b>.</p>
<h2>How it works</h2><div class="grid">${[['1 · Report','Describe the problem, pin it on the map, add a photo.'],['2 · AI understands','Category, summary, duplicates, priority with reasons.'],['3 · Discover','Hotspots and community signals appear on the map.'],['4 · Take action','Admins assign, officers fix, citizens track.']].map(([a,b])=>`<div class="card"><h3>${a}</h3><div class="mut">${b}</div></div>`).join('')}</div>
<h2>Civic impact right now</h2><div class="grid"><div class="card"><div class="big">${s.pct}%</div><div class="mut">of reports resolved</div></div><div class="card"><div class="big">${h.length}</div><div class="mut">hotspots (3+ related reports in one area)</div></div><div class="card"><div class="big">${S.c.filter(c=>c.merged).length+act().filter(c=>c.ai.dups&&c.ai.dups.length).length}</div><div class="mut">reports flagged as likely duplicates</div></div></div>
<h2>AI features: what is real</h2><div class="card sc"><table><tr><th>Feature</th><th>How it works here</th></tr><tr><td>Categorisation, summary, priority, action brief</td><td>Rule-based fallback (keyword and weighted scoring). No LLM key is configured.</td></tr><tr><td>Duplicate detection</td><td>Text similarity (Jaccard) plus map distance. Not embeddings.</td></tr><tr><td>Hotspots, Civic Intelligence Score</td><td>Grid clustering and a published formula over actual records.</td></tr></table></div>
<h2>Testimonials <span class="mut">(sample content, not real users)</span></h2><div class="grid"><div class="card">“I could see my report move to In Progress.” <div class="mut">Sample citizen</div></div><div class="card">“The duplicate grouping cut our queue.” <div class="mut">Sample officer</div></div></div>
<footer>FIXORE Civic Pulse · Prototype for PromptWars x ASTRA · Contact: demo@example.com (placeholder) · <a href="#about">Limitations</a></footer>`};
hooks.home=()=>document.querySelectorAll('.cnt').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*p);p<1&&requestAnimationFrame(f)})(t0)});
V.report=()=>{if(DONE){const c=get(DONE);return`<div class="card"><h2 style="margin-top:0">Complaint submitted ✔</h2><p>Your complaint ID is <b style="font-size:22px">${c.id}</b>. Keep it to track progress.</p><p class="mut">AI status: ${c.ai.fail?'<b>AI analysis failed. Fallback applied; a human will review.</b>':'analysed by the rule-based fallback engine (not an LLM).'}</p><button class="btn" onclick="detail('${c.id}')">View AI analysis</button><button class="btn g" onclick="TQ='${c.id}';location.hash='track'">Track it</button><button class="btn g" onclick="DONE='';render()">Report another</button></div>`}
 return`<h2 style="margin-top:0">Report a problem</h2><div class="grid g2"><div class="card"><button class="btn t s" onclick="demoFill()">Fill demo waterlogging report</button><label for="rt">Problem title</label><input id="rt" maxlength="90"><label for="rd">Description</label><textarea id="rd" rows="4"></textarea><label for="rc">Category</label><select id="rc"><option value="">Auto-detect with AI</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><label for="ri">Photo (JPG/PNG/WebP, max 3 MB)</label><input id="ri" type="file" accept="image/jpeg,image/png,image/webp" onchange="imgPick(this)"><div id="pv"></div><label for="rk">Contact (optional, never shown publicly)</label><input id="rk" placeholder="email or phone"><button class="btn" style="margin-top:14px" onclick="submitR()">Submit complaint</button></div>
 <div class="card"><h3>Location</h3><div class="mut">Tap the map to drop a pin (fictional city grid), or type coordinates.</div>${pinMap()}<div class="row"><input id="px" type="number" min="0" max="100" value="${Math.round(P.x)}" onchange="setPin(+this.value,P.y)" aria-label="X"><input id="py" type="number" min="0" max="100" value="${Math.round(P.y)}" onchange="setPin(P.x,+this.value)" aria-label="Y"></div><div class="mut" id="xy">${zone(P.x,P.y)}</div></div></div>`};
const pinMap=()=>`<svg class="map" id="pm" viewBox="0 0 100 100" onclick="pinClick(event)" role="img" aria-label="Pin map">${grid()}${act().map(c=>`<circle cx="${c.x}" cy="${c.y}" r="1" fill="#fff4"/>`).join('')}<circle id="pin" cx="${P.x}" cy="${P.y}" r="3" fill="#0fb8a5" stroke="#fff" stroke-width=".8"/></svg>`;

V.track=()=>{const c=TQ&&get(TQ.trim().toUpperCase()),mine=S.n.filter(n=>n.to==='citizen'&&(S.mine.includes(n.cid)||(c&&n.cid===c.id))).slice(0,8);

 ${TQ&&!c?'<div class="card warn" style="margin-top:14px">No complaint found with that ID.</div>':''}${c?`<div class="card" style="margin-top:14px">${body(c,false)}</div>`:''}

function body(c,adm){const a=c.ai,tl=ST.map(s=>{const h=c.history.filter(x=>x.s===s).at(-1);return`<li class="${h?'d':''}"><b>${s}</b> ${h?`<span class="mut">${fmt(h.t)}</span><div class="mut">${esc(h.note)}</div>`:'<span class="mut">pending</span>'}</li>`}).join('');
 return`<h3>${c.id} · ${esc(c.title)}</h3><div>${chip(lv(c))}<span class="chip o">${c.ov?'Officer override':'AI-assessed'}</span><span class="chip o">${c.status}</span><span class="chip o">${c.cat}</span>${c.synthetic?'<span class="chip o">Synthetic data</span>':''}</div>
 <p class="mut">${fmt(c.created)} · ${zone(c.x,c.y)} (${Math.round(c.x)}, ${Math.round(c.y)}) · Department: ${c.dept||'not yet assigned'}${c.officer?' · Officer '+c.officer:''}</p><p>${esc(c.desc)}</p>
 <div class="grid g2"><div><h3>Progress</h3><ul class="tl">${tl}</ul>${c.merged?`<div class="mut">Merged into ${c.merged}; original report preserved.</div>`:''}${c.ev?`<h3>Resolution evidence</h3><div class="mut">Before: ${esc(c.ev.before)} · After: ${esc(c.ev.after)}<br>${esc(c.ev.note)}</div>`:''}</div>
 <div><h3>AI transparency</h3><div class="mut">Engine: ${a.fail?'<b>FAILED, fallback status</b>':'rule-based fallback (not an LLM). Output is a suggestion, not a verified fact.'}</div>
 ${a.fail?'':`<p><b>Category:</b> ${a.cat} (confidence ${a.conf}%)${c.cat!==a.cat?' · reporter chose '+c.cat:''}<br><b>Summary:</b> ${esc(a.summary)}<br><b>Priority score:</b> ${a.score}/100 → ${a.level}</p>${Object.entries(a.f).map(([k,v])=>`<div class="row"><span class="l">${k}</span><div class="bar" style="width:${v*2.2}px"></div>${v}</div>`).join('')}`}

V.dash=()=>{const s=stats(),cnt=(f)=>CATS.map(c=>[c,S.c.filter(x=>x.cat===c&&!x.merged).filter(f||(()=>1)).length]),mx=a=>Math.max(1,...a.map(x=>x[1]));
 const cc=cnt(),pc=Object.keys(W).map(l=>[l,act().filter(c=>lv(c)===l).length]),days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);const a=d.getTime()-(13-i)*864e5;return S.c.filter(c=>c.created>=a&&c.created<a+864e5).length}),dm=Math.max(1,...days);

 return`<h2 style="margin-top:0">Live civic dashboard</h2><p class="mut">Computed from records stored in this browser. Seeded records are labelled synthetic demo data. Citizen contact details are never shown here.</p>

 <div class="card"><h3>Complaints per day (last 14 days)</h3><svg viewBox="0 0 280 90" style="width:100%"><polyline fill="none" stroke="#2b6bff" stroke-width="2.5" points="${days.map((v,i)=>`${i*21.5+4},${82-v/dm*70}`).join(' ')}"/>${days.map((v,i)=>`<circle cx="${i*21.5+4}" cy="${82-v/dm*70}" r="3" fill="#0fb8a5"/>`).join('')}</svg><div class="mut">Weekly total: ${days.slice(7).reduce((a,b)=>a+b,0)} (last 7 days)</div></div>
 <div class="card sc"><h3>Department performance</h3><table><tr><th>Dept</th><th>Assigned</th><th>Resolved</th><th>Avg hrs</th></tr>${dp.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div></div>

V.map=()=>{const L=filt(),w=100/M.z,x0=Math.max(0,Math.min(100-w,M.cx-w/2)),y0=Math.max(0,Math.min(100-w,M.cy-w/2)),H=hot(),sel=(k,o,all)=>`<select onchange="M.${k}=this.value;render()" aria-label="${all}"><option value="">${all}</option>${o.map(x=>`<option ${M[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
 let mk='';if(M.z===1&&M.cl){const g={};L.forEach(c=>{const k=Math.floor(c.x/20)+','+Math.floor(c.y/20);(g[k]=g[k]||[]).push(c)});mk=Object.values(g).map(a=>{const x=a.reduce((s,c)=>s+c.x,0)/a.length,y=a.reduce((s,c)=>s+c.y,0)/a.length,top=a.map(lv).sort((p,q)=>W[q]-W[p])[0];return a.length===1?dot(a[0],1.8):`<g onclick="M.z=2;M.cx=${x};M.cy=${y};render()" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${3+a.length*.7}" fill="${PC[top]}" stroke="#fff" stroke-width=".5"/><text x="${x}" y="${y+1.3}" font-size="3.5" text-anchor="middle" fill="#fff" font-weight="700">${a.length}</text></g>`}).join('')}else mk=L.map(c=>dot(c,1.8/Math.sqrt(M.z))).join('');
 return`<h2 style="margin-top:0">Civic map & hotspots</h2><p class="mut">Fictional city grid with synthetic and newly submitted reports (OpenStreetMap tiles cannot load in this hosted page).</p>

 <svg class="map" viewBox="${x0} ${y0} ${w} ${w}" role="img" aria-label="Complaint map">${grid()}${H.map(h=>`<circle cx="${h.x}" cy="${h.y}" r="9" fill="#0fb8a522" stroke="#0fb8a5" stroke-dasharray="1.5 1" stroke-width=".4"/>`).join('')}${mk}</svg>

V.about=()=>`<h2 style="margin-top:0">About & honesty note</h2><div class="card"><p><b>Real:</b> everything runs in your browser: submission, rule-based analysis, duplicate matching, priority scoring with explanations, hotspot clustering, the admin and officer workflow, and the citizen tracking timeline. Data persists in this browser’s localStorage only.</p><p><b>Mocked / not present:</b> no backend server, PostgreSQL, real authentication or role enforcement (the role switch is a demo), image upload to storage (previews only, file names saved), real email or SMS, LLM or embedding AI, or live OpenStreetMap tiles. All seeded complaints are <b>synthetic</b>.</p><p><b>Where the AI can be wrong:</b> keyword rules can miss context, sarcasm or other languages; priority scores are suggestions that officers can override; duplicate matching uses word overlap and distance.</p><p><b>Next steps:</b> Node/Express with PostgreSQL, JWT auth, an LLM and embeddings behind the server, real map tiles, image storage.</p></div>`;
